[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "governance-qa-bot"
version = "0.1.0"
description = "Vanilla RAG for document-grounded data governance Q&A"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openai>=1.68,<3", "python-dotenv>=1,<2", "pypdf>=5,<7"]

[project.optional-dependencies]
drive = ["google-auth[requests]>=2.38,<3"]
dev = ["build>=1,<2"]

[project.scripts]
governance-bot = "governance_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
